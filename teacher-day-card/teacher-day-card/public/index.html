<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>教師節快樂！</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles.css" />
</head>

<body class="page page-write">
  <main class="scene scene-write">

    <!-- Figma background -->
    <div class="scene-background" aria-hidden="true"></div>

    <!-- Figma green board -->
    <div class="board-layer" aria-hidden="true">
      <img
        class="greenboard"
        src="/assets/greenboard.png"
        alt=""
      />
    </div>

    <!-- Figma books + pencil -->
    <img
      class="bookpencil"
      src="/assets/bookpencil.png"
      alt=""
      aria-hidden="true"
    />

    <!-- Interactive layer -->
    <section class="write-ui" aria-label="Write a Teacher's Day wish">

      <!-- Chỉ để API giữ teacherName -->
      <input
        id="teacherName"
        type="hidden"
        value="老師"
      />

      <label class="message-field">
        <span class="sr-only">祝福內容</span>
        <textarea
          id="message"
          maxlength="1000"
          placeholder="老師～祝您教師節快樂！..."
        ></textarea>
      </label>

      <div class="sender-row">

        <label class="sender-field">
          <span class="sr-only">你的名字</span>
          <input
            id="studentName"
            maxlength="80"
            placeholder="你的名字：小鳳"
          />
        </label>

        <button
          id="createWish"
          class="airplane-button"
          type="button"
          aria-label="送出祝福"
        >
          <img
            src="/assets/airplane.png"
            alt="送出祝福"
          />
        </button>

      </div>
    </section>

    <!-- Existing result flow, preserved -->
   <section id="result" class="result-card" hidden>
  <div class="result-inner">
    <button id="closeResult" class="close-result" type="button" aria-label="關閉">×</button>

    <div class="mini-envelope">✉</div>

        <h2>你的祝福準備好了！</h2>

        <p>把這份小小的心意送給老師吧 ♡</p>

        <div class="link-row">
          <input id="wishUrl" readonly />
          <button id="copyLink" type="button">複製連結</button>
        </div>

        <button id="shareLink" class="share-button" type="button">
          分享給老師
        </button>

        <a
          id="previewLink"
          class="preview-link"
          target="_blank"
          rel="noreferrer"
        >
          先看看卡片 ↗
        </a>
      </div>
    </section>

    <div id="toast" class="toast" role="status"></div>

  </main>

  <script src="/app.js"></script>
</body>
</html>
