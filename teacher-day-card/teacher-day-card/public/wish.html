<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>給老師的一份心意</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/styles.css" />
</head>

<body class="page page-wish">

  <main class="scene scene-wish">

  <div class="scene-background" aria-hidden="true"></div>

  <p class="sender-note" id="senderNote"></p>

  <div class="pack-group" id="packGroup">

    <img
      class="pack"
      src="/assets/pack.png"
      alt=""
      aria-hidden="true"
    />

    <button
      class="openhere-button"
      id="openButton"
      type="button"
      aria-label="Open the card"
    >
      <img
        src="/assets/openhere.png"
        alt="OPEN HERE"
      />
    </button>

  </div>

  <div class="postcard-layer" id="postcardLayer">

    <img
      class="postcard"
      src="/assets/postcard.png"
      alt=""
      aria-hidden="true"
    />

    <div
      class="wish-message"
      id="wishMessage"
      aria-live="polite"
    ></div> <a class="send-another-link" href="/">
  換你送老師一份祝福吧 ♡
</a>

  </div>

  <div class="loading" id="loading">
    正在準備一份小小的心意…
  </div>

</main>

  <script src="/wish.js"></script><script>
  const scene = document.querySelector('.scene-wish');
  const openButton = document.getElementById('openButton');
  const postcardLayer = document.getElementById('postcardLayer');
  const wishMessage = document.getElementById('wishMessage');
  const loading = document.getElementById('loading');
  const senderNote = document.getElementById('senderNote');

  function getWishId() {
    const parts = window.location.pathname.split('/').filter(Boolean);
    const wishIndex = parts.indexOf('wish');

    if (wishIndex !== -1 && parts[wishIndex + 1]) {
      return parts[wishIndex + 1];
    }

    return null;
  }

  async function loadWish() {
    const wishId = getWishId();

    if (!wishId) {
      loading.textContent = '找不到這份祝福。';
      return;
    }

    try {
      const response = await fetch(
        `/api/wishes?id=${encodeURIComponent(wishId)}`
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Failed to load wish.');
      }

      wishMessage.textContent = data.message || '';

const senderName = data.studentName || '某位學生';
senderNote.textContent = `這是一份來自${senderName}的心意`;

      loading.style.display = 'none';

    } catch (error) {
      console.error(error);
      loading.textContent = '這份祝福暫時無法讀取。';
    }
  }

  openButton.addEventListener('click', () => {
    scene.classList.add('opened');
  });

  loadWish();
</script>

</body>
</html>
